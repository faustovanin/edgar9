        :root {

            --color-cream: #F2EAD0;

            --color-terracotta: #BF7D56;
        }

            color: var(--color-dark);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F2EAD0;
        }
        ::-webkit-scrollbar-thumb {
            background: #BFBBB0;

        }
        ::-webkit-scrollbar-thumb:hover {

        }

        .card-enter {

        }

            0% {

                opacity: 1;
                transform: translateY(0) scale(1);
            }

            outline: none;
            box-shadow: 0 0 0 3px rgba(191, 125, 86, 0.35);

        @media print {

            }

            const currentSection = stepIndex >= 3 ? routeSections[stepIndex - 3] : null;
            const result = React.useMemo(() => compute(answers), [answers]);
            const expressResult = React.useMemo(() => computeExpress(answers, variant), [answers, variant]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            const selectOption = (qId, optId) => {
                setAnswers((prev) => ({ ...prev, [qId]: { ...(prev[qId] || { note: '' }), value: optId } }));
            };

            const setNote = (qId, note) => {
                setAnswers((prev) => ({ ...prev, [qId]: { ...(prev[qId] || { value: null }), note } }));
            };

            const canAdvance = () => {
                if (stepIndex === 0) return !!route;
                if (stepIndex === 1) return !!businessName.trim() && !!role;
                if (stepIndex === 2) return !!maturity;
                if (isExpress && !expressEligible) return false;
                return missing(currentSection.id, answers).length === 0;
            };

            const loadModel = (data) => {
                setRoute(data.route === 'express' ? 'express' : 'complete');
                setBusinessName(typeof data.businessName === 'string' ? data.businessName : '');
                setRole(data.role || 'leader');
                setMaturity(data.maturity || 'idea');
                setAnswers(data.answers || {});
                if (data.lang && translations[data.lang]) setLang(data.lang);
                setIsCompleted(true);
            };

            // Share links carry the whole assessment as a base64 payload in ?id=; nothing is stored anywhere else
            React.useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const payload = params.get('id') || window.location.hash.replace('#', '');
                if (!payload) return;
                try {
                    const decoded = decodePayload(payload);
                    if (isScoreModel(decoded)) loadModel(decoded);
                } catch (e) {
                    console.warn("Could not decode URL model payload:", e);
                }
            }, []);

            const modelData = () => ({ version: MODEL_VERSION, route, businessName: businessName.trim(), role, maturity, answers, lang });

            const handleNext = () => {
                if (!canAdvance()) return;
                if (stepIndex < totalSteps - 1) {
                    setStepIndex(stepIndex + 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                setActiveTab('score');
                setIsCompleted(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePrev = () => {
                if (stepIndex > FIRST_STEP) setStepIndex(stepIndex - 1);
            };

            // Keyboard navigation listener (Enter to next)
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (isCompleted || e.key !== 'Enter' || e.shiftKey) return;
                    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
                    e.preventDefault();
                    handleNext();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [stepIndex, route, role, maturity, answers, isCompleted]);

            const handleCopyShareLink = () => {
                let shareUrl = window.location.origin + window.location.pathname;
                try {
                    if (window.location.href && !window.location.href.startsWith('blob:')) {
                        shareUrl = window.location.href.split('?')[0].split('#')[0];
                    }
                } catch (e) {
                    console.warn("Could not read location href:", e);
                }

                shareUrl += `?id=${encodeURIComponent(encodePayload(modelData()))}`;
                copyText(shareUrl);
                showToast(t.copiedAlert);
            };

            const startOver = () => {
                setRoute(DEFAULT_ROUTE); setBusinessName(''); setRole(''); setMaturity(''); setAnswers({}); setOpenNotes({});
                setStepIndex(FIRST_STEP); setIsCompleted(false); setActiveTab('score');
                try { window.history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ }
            };

            const renderOptionCard = (selected, onClick, title, desc, key) => (
                <button
                    key={key}
                    onClick={onClick}
                    className={`text-left p-4 rounded-xl border-2 transition-all ${
                        selected ? 'border-brandTerracotta bg-brandRose/10 shadow-md' : 'border-brandBorder/60 bg-white hover:border-brandTerracotta/60'
                    }`}
                >
                    <h3 className="font-bold text-brandDark text-base">{title}</h3>
                    <p className="text-xs text-brandDark/70 mt-1">{desc}</p>
                </button>
            );

            const renderQuestion = (q) => {
                const current = answers[q.id] || {};
                const noteOpen = openNotes[q.id] || !!current.note;
                return (
                    <div key={q.id} className="py-5 border-b border-brandBorder/30 last:border-b-0">
                        <div className="flex items-start justify-between gap-3">
                            <div>
                                <h3 className="font-bold text-brandDark text-base">{q.label[lang]}</h3>
                                {(q.hint || q.ref) && (
                                    <p className="text-[11px] text-brandDark/50 mt-0.5">{q.hint ? q.hint[lang] : q.ref}</p>
                                )}
                            </div>
                            {!q.scored && (
                                <span className="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-brandBorder/30 text-brandDark/60">{t.notScored}</span>
                            )}
                        </div>
                        <div className="flex flex-wrap gap-2 mt-3" role="radiogroup" aria-label={q.label[lang]}>
                            {q.options.map((op) => {
                                const selected = current.value === op.id;
                                return (
                                    <button
                                        key={op.id}
                                        role="radio"
                                        aria-checked={selected}
                                        onClick={() => selectOption(q.id, op.id)}
                                        className={`px-3.5 py-2 rounded-xl border text-sm font-semibold transition-all custom-ring ${
                                            selected
                                                ? 'bg-brandTerracotta border-brandTerracotta text-white shadow'
                                                : 'bg-white border-brandBorder text-brandDark hover:border-brandTerracotta'
                                        }`}
                                    >
                                        {op.label[lang]}
                                    </button>
                                );
                            })}
                        </div>
                        {noteOpen ? (
                            <textarea
                                rows="2"
                                value={current.note || ''}
                                onChange={(e) => setNote(q.id, e.target.value)}
                                placeholder={t.notePlaceholder}
                                className="mt-3 w-full p-3 rounded-xl border border-brandBorder bg-white text-brandDark focus:border-brandTerracotta custom-ring text-sm resize-none shadow-inner"
                            ></textarea>
                        ) : (
                            <button onClick={() => setOpenNotes({ ...openNotes, [q.id]: true })} className="mt-2 text-xs font-semibold text-brandDark/50 hover:text-brandTerracotta">
                                {t.addNote}
                            </button>
                        )}
                    </div>
                );
            };

            const renderSection = (section) => {
                const visible = section.questions.filter((q) => isVisible(q, answers));
                const groups = [];
                visible.forEach((q) => {
                    const g = q.group || '';
                    if (!groups.length || groups[groups.length - 1].id !== g) groups.push({ id: g, questions: [] });
                    groups[groups.length - 1].questions.push(q);
                });
                const sectionDone = missing(section.id, answers).length === 0;

                return (
                    <div key={section.id} className="card-enter">
                        <span className="text-xs font-extrabold uppercase tracking-wider text-brandTerracotta">
                            {isExpress ? t.routes.express.title : `${t.section} ${stepIndex - 2} / ${SECTIONS.length}`}
                        </span>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-brandDark mt-2">{section.title[lang]}</h2>
                        <p className="text-sm text-brandDark/70 mt-1">{section.intro[lang]}</p>
                        {section.ref && <p className="text-[11px] text-brandDark/50 mt-1">{section.ref}</p>}

                        {section.id === 'coring' && !isPlatform(answers) && (
                            <div className="mt-4 p-4 rounded-xl bg-brandCream border border-brandBorder text-sm text-brandDark">
                                <strong>ⓘ {t.notPlatformTitle}.</strong> {t.notPlatformDesc}
                            </div>
                        )}

                        <div className="mt-2">
                            {groups.map((g) => (
                                <div key={g.id || 'default'}>
                                    {g.id && <h4 className="mt-6 text-xs font-extrabold uppercase tracking-wider text-brandDark/60">{t.groups[g.id]}</h4>}
                                    {g.questions.map(renderQuestion)}
                                </div>
                            ))}
                        </div>

                        {section.id === 'org' && sectionDone && (
                            <div className="mt-4 p-4 rounded-xl bg-brandRose/10 border border-brandRose/40 text-sm">
                                {t.orgResult}: <strong>{result.organization.type.label[lang]}</strong>
                                <span className="text-brandDark/60"> ({result.organization.total} {t.points})</span>
                            </div>
                        )}
                        {section.id === 'ocean' && sectionDone && (
                            <div className="mt-4 p-4 rounded-xl bg-brandRose/10 border border-brandRose/40 text-sm">
                                {t.oceanResult}: <strong>{result.ocean.color.label[lang]}</strong>
                                <span className="text-brandDark/60"> ({result.ocean.total} {t.points})</span>
                            </div>
                        )}
                        {section.id === 'monetization' && result.warnings.length > 0 && (
                            <div className="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-300 text-sm space-y-1">
                                <div className="font-bold text-amber-900">⚠ {t.liveWarnings}</div>
                                {result.warnings.map((w) => <div key={w.id} className="text-amber-900">{w.text[lang]}</div>)}
                            </div>
                        )}
                    </div>
                );
            };

            const renderAnswersReport = () => (
                <div className="bg-white p-8 md:p-10 rounded-2xl border border-brandBorder/60 shadow-sm space-y-8 text-brandDark print-card">
                    <div className="border-b border-brandBorder pb-4 flex justify-between items-start flex-wrap gap-2">
                        <h3 className="text-xl font-extrabold">{t.answersTitle}{businessName.trim() ? ` · ${businessName.trim()}` : ''}</h3>
                        <div className="text-xs text-brandDark/70 text-right">
                            <div><strong>{t.perspective}:</strong> {t.roles[role]?.title || '—'}</div>
                            <div><strong>{t.stage}:</strong> {t.maturity[maturity]?.title || '—'}</div>
                        </div>
                    </div>
                    {routeSections.map((s) => (
                        <div key={s.id} className="space-y-2">
                            <h4 className="font-bold text-xs text-brandTerracotta uppercase tracking-wider">{s.title[lang]}</h4>
                            <div className="divide-y divide-brandBorder/30 bg-brandCream/30 rounded-xl border border-brandBorder/30 px-4">
                                {s.questions.filter((q) => isVisible(q, answers)).map((q) => {
                                    const a = answers[q.id] || {};
                                    const op = QUESTIONS[q.id].options.find((x) => x.id === a.value);
                                    return (
                                        <div key={q.id} className="py-2.5 text-sm">
                                            <div className="flex justify-between gap-3">
                                                <span className="text-brandDark/70">{q.label[lang]}</span>
                                                <span className="font-semibold text-right">{op ? op.label[lang] : <em className="text-brandDark/40">{t.noAnswer}</em>}</span>
                                            </div>
                                            {a.note && <p className="mt-1 text-xs text-brandDark/80 whitespace-pre-wrap"><strong>{t.note}:</strong> {a.note}</p>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                </div>
            );

            const renderBenchmark = () => {
                const rows = [...BENCHMARK_RESULTS.map((b) => ({ name: b.name, result: b.result, you: false })), { name: businessName.trim() ? `${businessName.trim()} (${t.you})` : t.you, result, you: true }]
                    .sort((a, b) => b.result.overall - a.result.overall);
                return (
                    <div className="bg-white/95 p-6 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                        <h3 className="font-extrabold text-brandDark text-base">{t.benchTitle}</h3>
                        <p className="text-xs text-brandDark/60 mt-1">{t.benchDesc}</p>
                        <div className="overflow-x-auto mt-4">
                            <table className="w-full text-sm min-w-[560px]">
                                <thead>
                                    <tr className="text-left text-xs uppercase tracking-wider text-brandDark/60">
                                        <th className="py-2 pr-3 font-bold">{t.company}</th>
                                        {PILLAR_KEYS.map((k) => <th key={k} className="py-2 px-3 font-bold">{t.pillars[k]}</th>)}
                                        <th className="py-2 pl-3 font-bold text-right">{t.overall}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map((r) => (
                                        <tr key={r.you ? '__you' : r.name} className={`border-t border-brandBorder/30 ${r.you ? 'bg-brandRose/15 font-bold' : ''}`}>
                                            <td className="py-2.5 pr-3">{r.name}</td>
                                            {PILLAR_KEYS.map((k) => (
                                                <td key={k} className="py-2.5 px-3">
                                                    <div className="flex items-center gap-2" title={`${fmt(r.result.pillars[k].raw)}/${r.result.pillars[k].max} ${t.points}`}>
                                                        <div className="w-20"><ProgressBar value={r.result.pillars[k].pct} color={r.you ? '#A8603A' : '#3E4039'} /></div>
                                                        <span className="tabular-nums text-xs">{fmt(r.result.pillars[k].pct)}%</span>
                                                    </div>
                                                </td>
                                            ))}
                                            <td className="py-2.5 pl-3 text-right tabular-nums">{fmt(r.result.overall)}%</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const renderOrgTypeCard = () => {
                const org = expressResult.organization;
                const bands = ORG_TYPES.map((band, i) => ({ ...band, max: i < ORG_TYPES.length - 1 ? ORG_TYPES[i + 1].min - 1 : org.max }));
                const idx = bands.findIndex((b) => b.id === org.type.id);
                const band = bands[idx];
                const within = band.max > band.min ? (org.total - band.min) / (band.max - band.min) : 0;
                const marker = ((idx + Math.min(1, Math.max(0, within))) / bands.length) * 100;
                return (
                    <div className="bg-white/95 p-6 md:p-8 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                        <div className="text-xs font-extrabold uppercase tracking-wider text-brandTerracotta">{t.orgTypeTitle}</div>
                        <h3 className="text-2xl md:text-3xl font-extrabold text-brandDark mt-2">{businessName.trim()}</h3>
                        <div className="mt-1 text-lg font-bold text-brandDark">
                            {t.orgTypeIs} <span className="text-brandTerracotta">{org.type.label[lang]}</span>
                            <span className="text-sm font-medium text-brandDark/60 tabular-nums"> · {org.total} / {org.max} {t.points}</span>
                        </div>
                        <p className="text-sm text-brandDark/80 mt-3 leading-relaxed max-w-2xl">{org.type.desc[lang]}</p>

                        <div className="mt-8" role="img" aria-label={`${org.type.label[lang]}: ${org.total} ${t.points}`}>
                            <div className="relative h-6">
                                <div className="absolute -translate-x-1/2 flex flex-col items-center" style={{ left: `${marker}%` }}>
                                    <span className="text-[11px] font-bold text-brandDark tabular-nums">{org.total}</span>
                                    <span className="w-0 h-0 border-l-[6px] border-r-[6px] border-t-[7px] border-l-transparent border-r-transparent border-t-brandDark"></span>
                                </div>
                            </div>
                            <div className="grid grid-cols-4 gap-0.5">
                                {bands.map((b) => (
                                    <div key={b.id} className={`h-3 first:rounded-l-full last:rounded-r-full ${b.id === org.type.id ? 'bg-[#A8603A]' : 'bg-brandBorder/40'}`}></div>
                                ))}
                            </div>
                            <div className="grid grid-cols-4 gap-0.5 mt-2">
                                {bands.map((b) => (
                                    <div key={b.id} className="text-center">
                                        <div className={`text-xs font-bold ${b.id === org.type.id ? 'text-brandDark' : 'text-brandDark/60'}`}>{b.label[lang]}</div>
                                        <div className="text-[11px] text-brandDark/50 tabular-nums">{b.id === 'hacker' ? `${b.min}+` : `${b.min}–${b.max}`} {t.points}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderExpressScorecard = () => (
                <div className="space-y-6">
                    <div className={`grid grid-cols-1 gap-4 ${expressResult.dimensions.length === 2 ? 'md:grid-cols-3' : 'md:grid-cols-4'}`}>
                        <div className="bg-brandDark text-brandCream p-6 rounded-2xl shadow-sm print-card">
                            <div className="text-xs font-extrabold uppercase tracking-wider text-brandRose">{t.expressOverall}</div>
                            <div className="text-5xl font-extrabold mt-2 tabular-nums">{fmt(expressResult.overall)}<span className="text-2xl">%</span></div>
                            <p className="text-xs text-brandCream/70 mt-2 tabular-nums">{fmt(expressResult.raw)} / {expressResult.max} {t.points}. {t.expressOverallDesc}</p>
                        </div>
                        {expressResult.dimensions.map((d) => (
                            <div key={d.id} className="bg-white/95 p-6 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                <div className="text-xs font-extrabold uppercase tracking-wider text-brandTerracotta">{d.label[lang]}</div>
                                <div className="text-4xl font-extrabold text-brandDark mt-2 tabular-nums">{fmt(d.pct)}<span className="text-xl">%</span></div>
                                <div className="text-xs text-brandDark/60 mt-1 mb-3 tabular-nums">{fmt(d.raw)} / {d.max} {t.points}</div>
                                <ProgressBar value={d.pct} />
                            </div>
                        ))}
                    </div>

                    <div className="bg-white/95 p-6 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                        <h3 className="font-extrabold text-brandDark text-base">{t.alertsTitle}</h3>
                        {expressResult.alerts.length === 0 ? (
                            <p className="text-sm text-brandDark/70 mt-2">✓ {t.noAlerts}</p>
                        ) : (
                            <ul className="mt-3 space-y-2">
                                {expressResult.alerts.map((a) => (
                                    <li key={a.id} className="flex items-start gap-2 p-3 rounded-xl bg-amber-50 border border-amber-300 text-sm text-amber-900">
                                        <span aria-hidden="true">⚠</span>
                                        <span><strong>{t.warningLabel}:</strong> {a.text[lang]}</span>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    <div>
                        <h3 className="font-extrabold text-brandDark text-base mb-3">{t.breakdownTitle}</h3>
                        <div className={`grid grid-cols-1 gap-4 ${expressResult.dimensions.length === 2 ? 'lg:grid-cols-2' : 'lg:grid-cols-3'}`}>
                            {expressResult.dimensions.map((d) => (
                                <div key={d.id} className="bg-white/95 p-5 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                    <div className="flex justify-between items-baseline">
                                        <h4 className="font-bold text-sm text-brandTerracotta">{d.label[lang]}</h4>
                                        <span className="text-xs font-bold tabular-nums">{fmt(d.raw)}/{d.max}</span>
                                    </div>
                                    <BreakdownRows
                                        items={d.items.map((it) => it.id === 'exp_time' && answers.exp_time?.value === 'ideas' && it.points > 0
                                            ? { ...it, answer: { en: `${it.answer.en} · ${translations.en.ideasBonus}`, pt: `${it.answer.pt} · ${translations.pt.ideasBonus}` } }
                                            : it)}
                                        lang={lang}
                                        t={t}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderScorecard = () => (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-brandDark text-brandCream p-6 rounded-2xl shadow-sm print-card">
                            <div className="text-xs font-extrabold uppercase tracking-wider text-brandRose">{t.overall}</div>
                            <div className="text-5xl font-extrabold mt-2 tabular-nums">{fmt(result.overall)}<span className="text-2xl">%</span></div>
                            <p className="text-xs text-brandCream/70 mt-2">{t.overallDesc}</p>
                        </div>
                        {PILLAR_KEYS.map((k) => {
                            const pl = result.pillars[k];
                            return (
                                <div key={k} className="bg-white/95 p-6 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                    <div className="text-xs font-extrabold uppercase tracking-wider text-brandTerracotta">{t.pillars[k]}</div>
                                    <div className="text-4xl font-extrabold text-brandDark mt-2 tabular-nums">{fmt(pl.pct)}<span className="text-xl">%</span></div>
                                    <div className="text-xs text-brandDark/60 mt-1 mb-3 tabular-nums">{fmt(pl.raw)} / {pl.max} {t.points}</div>
                                    <ProgressBar value={pl.pct} />
                                </div>
                            );
                        })}
                    </div>

                    <PillarChart result={result} t={t} />

                    <div className="bg-white/95 p-6 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                        <h3 className="font-extrabold text-brandDark text-base">{t.warningsTitle}</h3>
                        {result.warnings.length === 0 ? (
                            <p className="text-sm text-brandDark/70 mt-2">✓ {t.noWarnings}</p>
                        ) : (
                            <ul className="mt-3 space-y-2">
                                {result.warnings.map((w) => (
                                    <li key={w.id} className="flex items-start gap-2 p-3 rounded-xl bg-amber-50 border border-amber-300 text-sm text-amber-900">
                                        <span aria-hidden="true">⚠</span>
                                        <span><strong>{t.warningLabel}:</strong> {w.text[lang]}</span>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    <div>
                        <h3 className="font-extrabold text-brandDark text-base mb-3">{t.breakdownTitle}</h3>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <div className="bg-white/95 p-5 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                <div className="flex justify-between items-baseline">
                                    <h4 className="font-bold text-sm text-brandTerracotta">{t.pillars.exponential}</h4>
                                    <span className="text-xs font-bold tabular-nums">{fmt(result.pillars.exponential.raw)}/{result.pillars.exponential.max}</span>
                                </div>
                                <BreakdownRows items={result.pillars.exponential.items} lang={lang} t={t} />
                            </div>
                            <div className="bg-white/95 p-5 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                <div className="flex justify-between items-baseline">
                                    <h4 className="font-bold text-sm text-brandTerracotta">{t.pillars.tipping}</h4>
                                    <span className="text-xs font-bold tabular-nums">{fmt(result.pillars.tipping.raw)}/{result.pillars.tipping.max}</span>
                                </div>
                                {result.pillars.tipping.subscores.map((s) => (
                                    <div key={s.id} className="mt-3">
                                        <div className="flex justify-between items-baseline bg-brandCream/50 rounded-lg px-2 py-1">
                                            <span className="text-xs font-bold">{s.label[lang]} <span className="font-medium text-brandDark/50">· {s.hint[lang]}</span></span>
                                            <span className="text-xs font-bold tabular-nums">{fmt(s.points)}/{s.max}</span>
                                        </div>
                                        {/* Appeal inputs are weights in 32 − (max/min) × culture, not additive points */}
                                        <BreakdownRows items={s.id === 'appeal' ? s.items.map((it) => ({ ...it, max: null })) : s.items} lang={lang} t={t} />
                                    </div>
                                ))}
                            </div>
                            <div className="bg-white/95 p-5 rounded-2xl border border-brandBorder/60 shadow-sm print-card">
                                <div className="flex justify-between items-baseline">
                                    <h4 className="font-bold text-sm text-brandTerracotta">{t.pillars.coring}</h4>
                                    <span className="text-xs font-bold tabular-nums">{fmt(result.pillars.coring.raw)}/{result.pillars.coring.max}</span>
                                </div>
                                <BreakdownRows items={result.pillars.coring.items} lang={lang} t={t} />
                            </div>
                        </div>
                    </div>
                </div>
            );

            const tabClass = (key) => `px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === key ? 'bg-brandDark text-brandCream shadow' : 'text-brandDark hover:bg-white/60'
            }`;
            const actionClass = "px-3.5 py-2 rounded-xl border border-brandBorder bg-white text-xs font-bold text-brandDark hover:bg-brandCream transition-all flex items-center space-x-1.5 shadow-sm";

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <header className="w-full px-6 py-4 flex items-center justify-between border-b border-brandBorder bg-brandCream/90 backdrop-blur sticky top-0 z-40 no-print">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => { setStepIndex(FIRST_STEP); setIsCompleted(false); }}>
                            <div className="w-10 h-10 rounded-xl bg-brandTerracotta flex items-center justify-center text-brandCream font-bold text-xl shadow-md group-hover:bg-brandDark transition-all">
                                E9
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold tracking-tight text-brandDark">{t.brand}</h1>
                                <p className="text-xs text-brandDark/70 font-medium">{t.tagline}</p>
                            </div>
                        </div>
                        <button
                            onClick={() => setLang(lang === 'en' ? 'pt' : 'en')}
                            className="px-3 py-1.5 rounded-lg border border-brandBorder bg-white text-xs font-bold text-brandDark hover:bg-brandRose hover:text-white transition-all shadow-sm"
                        >
                            {lang === 'en' ? '🇧🇷 PT' : '🇺🇸 EN'}
                        </button>
                    </header>

                    <main className="flex-grow w-full max-w-5xl mx-auto px-4 py-8">
                        {!isCompleted ? (
                            <div className="max-w-3xl mx-auto bg-white/90 backdrop-blur rounded-2xl p-6 md:p-10 shadow-xl border border-brandBorder/60">
                                <div className="mb-8">
                                    <div className="flex justify-between text-xs font-bold text-brandDark/60 mb-2">
                                        <span>{t.stepOf} {stepIndex - FIRST_STEP + 1} {t.of} {totalSteps - FIRST_STEP}</span>
                                        <span>{Math.round(((stepIndex - FIRST_STEP + 1) / (totalSteps - FIRST_STEP)) * 100)}% {t.completed}</span>
                                    </div>
                                    <ProgressBar value={((stepIndex - FIRST_STEP + 1) / (totalSteps - FIRST_STEP)) * 100} color="#BF7D56" />
                                </div>

                                {stepIndex === 0 && (
                                    <div className="card-enter">
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-brandDark">{t.chooseRoute}</h2>
                                        <p className="text-xs text-brandDark/70 mt-1">{t.chooseRouteDesc}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
                                            {['express', 'complete'].map((key) => renderOptionCard(route === key, () => setRoute(key), t.routes[key].title, t.routes[key].desc, key))}
                                        </div>
                                    </div>
                                )}

                                {stepIndex === 1 && (
                                    <div className="card-enter">
                                        <label htmlFor="business-name" className="block text-sm font-bold text-brandDark">
                                            {t.businessName} <span className="text-brandTerracotta" aria-hidden="true">*</span>
                                        </label>
                                        <input
                                            id="business-name"
                                            type="text"
                                            required
                                            aria-required="true"
                                            maxLength={80}
                                            value={businessName}
                                            onChange={(e) => setBusinessName(e.target.value)}
                                            placeholder={t.businessNamePlaceholder}
                                            className="mt-2 mb-8 w-full p-3.5 rounded-xl border border-brandBorder bg-white text-brandDark focus:border-brandTerracotta custom-ring text-base"
                                        />
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-brandDark">{t.whoAreYou}</h2>
                                        <p className="text-xs text-brandDark/70 mt-1">{t.whoAreYouDesc}</p>
                                        <div className="grid grid-cols-1 gap-3 mt-6">
                                            {Object.entries(t.roles).map(([key, r]) => renderOptionCard(role === key, () => setRole(key), r.title, r.desc, key))}
                                        </div>
                                    </div>
                                )}

                                {stepIndex === 2 && (
                                    <div className="card-enter">
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-brandDark">{t.maturityState}</h2>
                                        <p className="text-xs text-brandDark/70 mt-1">{t.maturityStateDesc}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
                                            {Object.entries(t.maturity).map(([key, m]) => renderOptionCard(maturity === key, () => setMaturity(key), m.title, m.desc, key))}
                                        </div>
                                    </div>
                                )}

                                {currentSection && (isExpress && !expressEligible ? (
                                    <div className="card-enter">
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-brandDark">{t.expressUnavailableTitle}</h2>
                                        <p className="text-sm text-brandDark/70 mt-2">{t.expressUnavailableDesc}</p>
                                        {ENABLE_COMPLETE_ROUTE && <button
                                            onClick={() => setRoute('complete')}
                                            className="mt-6 px-5 py-3 rounded-xl font-bold text-xs text-brandCream bg-brandTerracotta hover:bg-brandDark shadow-md transition-all"
                                        >
                                            {t.switchToComplete} →
                                        </button>}
                                    </div>
                                ) : renderSection(currentSection))}

                                <div className="mt-8 pt-6 border-t border-brandBorder/40 flex items-center justify-between">
                                    <button
                                        onClick={handlePrev}
                                        disabled={stepIndex === FIRST_STEP}
                                        className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all ${stepIndex === FIRST_STEP ? 'opacity-0 cursor-default' : 'text-brandDark hover:bg-brandBorder/30'}`}
                                    >
                                        ← {t.prev}
                                    </button>
                                    <button
                                        onClick={handleNext}
                                        disabled={!canAdvance()}
                                        title={!canAdvance() && stepIndex >= 3 ? t.answerAll : (!canAdvance() && stepIndex === 1 ? t.nameAndProfileRequired : '')}
                                        className={`px-6 py-3 rounded-xl font-bold text-xs text-brandCream shadow-md transition-all flex items-center space-x-2 ${
                                            !canAdvance() ? 'bg-brandBorder cursor-not-allowed opacity-60' : 'bg-brandTerracotta hover:bg-brandDark hover:scale-[1.02] active:scale-[0.98]'
                                        }`}
                                    >
                                        <span>{stepIndex === totalSteps - 1 ? t.submit : t.next}</span>
                                        <span>→</span>
                                    </button>
                                </div>
                                <div className="mt-4 text-center text-xs text-brandDark/50 font-medium">
                                    {!canAdvance() && stepIndex >= 3 ? t.answerAll : (!canAdvance() && stepIndex === 1 ? t.nameAndProfileRequired : t.keyboardTip)}
                                </div>
                            </div>
                        ) : (
                            <div className="w-full space-y-6 card-enter">
                                <div className="bg-white/90 backdrop-blur rounded-2xl p-6 shadow-xl border border-brandBorder/60 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <span className="text-xs text-brandDark/60 font-bold uppercase">
                                            {t.routes[route]?.title || '—'} • {t.roles[role]?.title || '—'} • {t.maturity[maturity]?.title || '—'}
                                        </span>
                                        <h2 className="text-2xl font-extrabold text-brandDark mt-1">{businessName.trim() || t.summaryTitle}</h2>
                                        {businessName.trim() && <p className="text-sm font-semibold text-brandTerracotta">{isExpress && expressResult.kind === 'orgType' ? t.orgTypeTitle : t.summaryTitle}</p>}
                                        <p className="text-xs text-brandDark/60 mt-0.5 hidden print:block">{new Date().toLocaleDateString()}</p>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-2 no-print">
                                        <button onClick={handleCopyShareLink} className={actionClass}><span>🔗</span><span>{t.shareURL}</span></button>
                                        <button onClick={() => window.print()} className="px-3.5 py-2 rounded-xl bg-brandTerracotta text-white text-xs font-bold hover:bg-brandDark transition-all flex items-center space-x-1.5 shadow-sm">
                                            <span>🖨️</span><span>{t.exportText}</span>
                                        </button>
                                        <button onClick={() => { setIsCompleted(false); setStepIndex(3); }} className={actionClass}>✏️ {t.editAnswers}</button>
                                    </div>
                                </div>

                                <div className="flex space-x-2 border-b border-brandBorder/60 pb-2 no-print">
                                    {(isExpress ? ['score', 'answers'] : ['score', 'bench', 'answers']).map((k) => (
                                        <button key={k} onClick={() => setActiveTab(k)} className={tabClass(k)}>{t.tabs[k]}</button>
                                    ))}
                                </div>

                                {/* Inactive tabs stay hidden on screen but are all printed */}
                                <div className={`${activeTab === 'score' ? '' : 'hidden'} print:block`}>{isExpress ? (expressResult.kind === 'orgType' ? renderOrgTypeCard() : renderExpressScorecard()) : renderScorecard()}</div>
                                {!isExpress && <div className={`${activeTab === 'bench' ? '' : 'hidden'} print:block print:mt-6`}>{renderBenchmark()}</div>}
                                <div className={`${activeTab === 'answers' ? '' : 'hidden'} print:block print:mt-6`}>{renderAnswersReport()}</div>

                                <div className="text-center pt-4 no-print">
                                    <button onClick={startOver} className="text-xs font-bold text-brandDark/60 hover:text-brandTerracotta underline">{t.startOver}</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-brandDark text-brandCream text-sm font-semibold px-5 py-3 rounded-xl shadow-xl z-50 no-print">
                            {toastMessage}
                        </div>
                    )}

                    <footer className="w-full text-center py-6 text-xs text-brandDark/50 no-print">
                        Edgar9 • {t.tagline} • Molho Secreto
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
